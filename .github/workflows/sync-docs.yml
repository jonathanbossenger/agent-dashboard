name: Sync DocsPress documentation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docspress-sync
  cancel-in-progress: false

jobs:
  sync:
    # Skip a push created by merging the managed WordPress proposal.
    if: >-
      github.event_name != 'push' ||
      !contains(
        github.event.head_commit.message,
        format('from {0}/docspress/wordpress-sync', github.repository_owner)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Automattic/docspress@8e76d6d67c91e0a94f2e8ec491f28ac1b0a47322 # v0.5.0
        with:
          mode: reconcile
          wordpress-site: psykrotek.co.za
          wordpress-access-token: ${{ secrets.WP_ACCESS_TOKEN }}
          docs-dir: docs
          root-slug: docs
          root-title: Docs
          create-h1: false
          rewrite-links: true
          edit-link: false
          pull-request-branch: docspress/wordpress-sync
          delete-mode: trash
          dry-run: true